<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Matches Dashboard Parchment/Cream Theme) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4E8"/>
      <stop offset="100%" stop-color="#F4E8D1"/>
    </linearGradient>

    <!-- Primary Accent Gradient (Deep Brown to Warm Mocha) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#5A270B"/>
      <stop offset="100%" stop-color="#3B1604"/>
    </linearGradient>

    <!-- Progress Indicator Gradient (Warm Amber to Gold) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Book Pages Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />

  <!-- Outer Tracker Ring -->
  <circle cx="250" cy="205" r="125" fill="none" stroke="#E6D5BC" stroke-width="8" stroke-dasharray="6 8" />
  <path d="M 250 80 A 125 125 0 1 1 130 240" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />

  <!-- Main Symbol: Book + Progress Marker -->
  <g transform="translate(0, -5)">
    <!-- Left Book Page -->
    <path d="M 250 255 C 210 235, 160 235, 120 250 L 120 160 C 160 145, 210 145, 250 165 Z" 
          fill="url(#pageGrad)" stroke="#E6D5BC" stroke-width="2" opacity="0.95" />

    <!-- Right Book Page -->
    <path d="M 250 255 C 290 235, 340 235, 380 250 L 380 160 C 340 145, 290 145, 250 165 Z" 
          fill="url(#pageGrad)" stroke="#E6D5BC" stroke-width="2" opacity="0.98" />

    <!-- Book Spine Line -->
    <path d="M 250 165 L 250 255" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Integrated Ribbon Bookmark -->
    <path d="M 250 135 L 250 270 L 238 258" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Overlay Checkmark / Progress Sweep -->
    <path d="M 145 195 L 195 220 L 350 125" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <text x="250" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#5A270B" text-anchor="middle" letter-spacing="3">
    BOOK TRACKER
  </text>
  <text x="250" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#8B4513" text-anchor="middle" letter-spacing="5">
    PERSONAL READING LOG
  </text>
</svg>
